name: Label rerun

# Automatic label-based reruns are disabled. Start this workflow manually with
# a branch, tag, or commit ref to launch the selected slow lanes on demand.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to test
        required: true
        type: string
        default: main
permissions:
  actions: write
  pull-requests: read

concurrency:
  group: manual-ci-lanes-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  rerun-with-e2e:
    name: Run CI, Docker, and Nix on demand
    if: github.event_name == 'workflow_dispatch'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Dispatch CI, Docker, and Nix for the selected ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          for workflow in ci.yaml docker.yml nix.yml; do
            gh workflow run "$workflow" --repo "$REPO" --ref "$REF"
            echo "$workflow: dispatched for $REF"
          done
